name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apicore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: apicore
      DB_USER: root
      DB_PASSWORD: root
      # CI-only value: never reuse it outside this workflow
      JWT_SECRET: ci-only-not-a-production-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python3 -m pip install -r api/v1/py/requirements.txt

      - name: Load schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < apicore.sql

      - name: Python unit tests
        working-directory: api/v1/py
        run: python3 -m unittest discover -s tests -t . -v

      - name: Integration tests against Python
        run: python3 -m unittest discover -s tests -t . -v

      - name: Integration tests against PHP
        env:
          API_LANGUAGE: php
        run: python3 -m unittest discover -s tests -t . -v

  php-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: pdo_mysql, mbstring

      - name: Lint every PHP file
        run: |
          find api/v1/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP unit tests
        working-directory: api/v1/php
        run: php tests/run.php
